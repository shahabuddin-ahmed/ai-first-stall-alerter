# Backend development: docker compose up --build (or the root docker-compose.yml for the whole app)
# Settings come from .env in this folder. API: http://localhost:4000/api/v1 · phpMyAdmin: http://localhost:8080
services:
    db:
        image: mysql:8.0
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - "3306:3306"
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            # 127.0.0.1 (TCP), not localhost (socket): the first-run setup server accepts only socket connections
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 30

    # Runs the migrations and default data, then starts the API with nodemon
    backend:
        build:
            context: .
            dockerfile: Dockerfile.dev
        command: sh -c "yarn db:migrate && yarn db:seed && yarn dev"
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        env_file: .env
        environment:
            # Inside Docker the database is the db service
            MYSQL_HOST: db
            MYSQL_PORT: 3306
            # File events from macOS do not always reach Docker, so the watcher also checks for changes itself
            CHOKIDAR_USEPOLLING: "true"
        ports:
            - "4000:4000"
        # The code folder is linked into the container; node_modules stay inside it (Linux builds)
        volumes:
            - .:/server
            - /server/node_modules

    # Database browser (user root)
    phpmyadmin:
        image: phpmyadmin:5
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        environment:
            PMA_HOST: db
            PMA_USER: root
            PMA_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - "8080:80"

volumes:
    db-data:
        name: stallalert-dev-data
