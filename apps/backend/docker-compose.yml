services:
    # StallAlert API (development)
    api:
        container_name: stallalert-api
        build:
            dockerfile: Dockerfile.dev
            context: .
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "${APPLICATION_SERVER_PORT:-4000}:${APPLICATION_SERVER_PORT:-4000}"
        volumes:
            - .:/server
            # Keep the container's own node_modules (Linux), not the host's
            - /server/node_modules
        # Update the tables and default data first, then start the API
        command: sh -c "yarn db:migrate && yarn db:seed && yarn dev"
        environment:
            - APPLICATION_SERVER_PORT=${APPLICATION_SERVER_PORT:-4000}
            - APP_FORCE_SHUTDOWN_SECOND=${APP_FORCE_SHUTDOWN_SECOND:-30}
            - MYSQL_HOST=db
            - MYSQL_PORT=3306
            - MYSQL_DATABASE=${MYSQL_DATABASE:-stallalert}
            - MYSQL_TEST_DATABASE=${MYSQL_TEST_DATABASE:-stallalert_test}
            - MYSQL_USER=${MYSQL_USER:-stallalert}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD:-stallalert}

    # Database (local development only; fictional data)
    db:
        container_name: stallalert-mysql
        image: mysql:8.0
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
        ports:
            - "${MYSQL_PORT:-3306}:3306"
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-stallalert}
            MYSQL_USER: ${MYSQL_USER:-stallalert}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stallalert}
            MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-stallalert_test}
        volumes:
            - stallalert-mysql-data:/var/lib/mysql
            # Creates the test database on the first start
            - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 20

    # phpMyAdmin (http://localhost:8080)
    phpmyadmin:
        container_name: stallalert-phpmyadmin
        image: phpmyadmin/phpmyadmin
        depends_on:
            - db
        restart: always
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

volumes:
    stallalert-mysql-data:
