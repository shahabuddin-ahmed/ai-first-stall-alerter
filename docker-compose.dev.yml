# Development mode: the app reloads by itself when you save a file. Use it together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Your code folders are linked into the containers; node_modules stay inside the containers (Linux builds).
services:
    backend:
        build:
            context: ./apps/backend
            dockerfile: Dockerfile.dev
        # nodemon restarts the API when a file in src/ changes
        command: sh -c "yarn db:migrate && yarn db:seed && yarn dev"
        environment:
            NODE_ENV: development
            # File events from macOS do not always reach Docker, so the watcher also checks for changes itself
            CHOKIDAR_USEPOLLING: "true"
        volumes:
            - ./apps/backend:/server
            - /server/node_modules

    frontend:
        build:
            context: ./apps/frontend
            dockerfile: Dockerfile.dev
        environment:
            NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}/api/v1
            WATCHPACK_POLLING: "true"
        volumes:
            - ./apps/frontend:/app
            - /app/node_modules
            - /app/.next
