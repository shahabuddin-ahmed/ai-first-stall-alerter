# The whole app with one command: docker compose up --build
# Web: http://localhost:3000 · API: http://localhost:4000/api/v1 (host ports can be changed in .env)
# Optional: put AI_API_KEY in a .env file next to this one (see .env.example). Without it, messages use templates.
services:
    db:
        image: mysql:8.0
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
        ports:
            - "${MYSQL_HOST_PORT:-3306}:3306"
        volumes:
            - stallalert-data:/var/lib/mysql
        healthcheck:
            # 127.0.0.1 (TCP), not localhost (socket): the first-run setup server accepts only socket connections
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 30

    # Runs the migrations and default data, then starts the API
    backend:
        build:
            context: ./apps/backend
            args:
                PORT: 4000
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        environment:
            NODE_ENV: production
            APPLICATION_SERVER_PORT: 4000
            MYSQL_HOST: db
            MYSQL_PORT: 3306
            MYSQL_DATABASE: stallalert
            MYSQL_USER: root
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
            WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
            AI_API_KEY: ${AI_API_KEY:-}
            # AI limits: change them in the root .env (these defaults match the code)
            AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-8000}
            AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
            AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
            AI_TOP_N: ${AI_TOP_N:-5}
        ports:
            - "${API_PORT:-4000}:4000"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 20s

    frontend:
        build:
            context: ./apps/frontend
            args:
                NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}/api/v1
        restart: unless-stopped
        depends_on:
            backend:
                condition: service_healthy
        ports:
            - "${WEB_PORT:-3000}:3000"

    # Database browser for local use: http://localhost:8080 (user root)
    phpmyadmin:
        image: phpmyadmin:5
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        environment:
            PMA_HOST: db
            PMA_USER: root
            PMA_PASSWORD: ${MYSQL_PASSWORD:-root}
        ports:
            - "${PMA_PORT:-8080}:80"

volumes:
    stallalert-data:
