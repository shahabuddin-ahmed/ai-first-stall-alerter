# Backend production: docker compose -f docker-compose.prod.yml up --build -d
# Settings come from .env in this folder.
services:
    db:
        image: mysql:8.0
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in apps/backend/.env}
        # No port on the host: only the API reaches the database
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            # 127.0.0.1 (TCP), not localhost (socket): the first-run setup server accepts only socket connections
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 30

    # Runs the migrations and default data, then starts the API
    backend:
        build:
            context: .
            args:
                PORT: 4000
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        env_file: .env
        environment:
            NODE_ENV: production
            APPLICATION_SERVER_PORT: 4000
            # Inside Docker the database is the db service
            MYSQL_HOST: db
            MYSQL_PORT: 3306
        ports:
            - "4000:4000"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 20s

volumes:
    db-data:
        name: stallalert-prod-data
